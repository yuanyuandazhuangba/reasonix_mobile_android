name: Build & Release APK

# 推送形如 v1.0.0 的 tag 时，自动构建 APK 并发布到 Releases，
# GitHub 用户可在仓库 Releases 页直接下载。
on:
  push:
    tags:
      - 'v*'

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    name: Build APK and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/Reasonix_Mobile_${GITHUB_REF_NAME}.apk"
          ls -lh release-assets

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reasonix_Mobile_APK
          path: release-assets/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          name: Reasonix Mobile ${{ github.ref_name }}
          files: release-assets/*.apk
          generate_release_notes: true
