name: Build & Release APK

# 推送形如 v1.0.0 的 tag 时，自动构建 APK 并发布到 Releases，
# GitHub 用户可在仓库 Releases 页直接下载。
on:
  push:
    tags:
      - 'v*'

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    name: Build APK and publish release
    runs-on: ubuntu-latest

    env:
      # GitHub Actions 跑在海外，直连官方源比走阿里云镜像更快，也避开了
      # 镜像不完整（如 com.android.tools.utp 在部分镜像上是 404）与偶发 5xx
      # （Gradle 遇 5xx 直接失败、不会回退到后续仓库）导致构建失败的问题。
      US_MAVEN: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 已预装 Android SDK，这里只补齐本项目需要的组件，
      # 不依赖第三方 setup-android action。
      - name: Ensure Android SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK"
          echo "--- SDK dir ---"
          ls "$SDK" || true
          echo "--- cmdline-tools ---"
          ls "$SDK/cmdline-tools" || true
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          echo "SDKMGR=$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-34" "build-tools;34.0.0" || true
          echo "--- installed platforms / build-tools ---"
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 先跑单元测试：PairingInfo 的解析边界（私网判定、端口归一化、畸形输入）是
      # 本项目唯一被自动化覆盖的逻辑，回归成本低但价值高。
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      # 版本号取自 tag（如 v1.2.3 → 1.2.3 / 10203），避免 APK 里的版本
      # 与发布标签长期不一致。
      - name: Build debug APK
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE=$(echo "$VERSION_NAME" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          if [ -z "$VERSION_CODE" ]; then
            echo "无法从 tag 解析版本号：$GITHUB_REF_NAME，回退默认值"
            VERSION_CODE=1
          fi
          echo "versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      - name: Collect APK
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/Reasonix_Mobile_${GITHUB_REF_NAME}.apk"
          ls -lh release-assets

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reasonix_Mobile_APK
          path: release-assets/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          name: Reasonix Mobile ${{ github.ref_name }}
          files: release-assets/*.apk
          generate_release_notes: true
