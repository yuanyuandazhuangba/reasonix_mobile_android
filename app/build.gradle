plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 版本号可由 CI 用 -PversionCode / -PversionName 注入（取自 git tag），
// 避免 APK 里的版本与发布标签长期不同步。
// 注意：这里必须用 Groovy 的 String 方法（isInteger/toInteger），
// Kotlin 风格的 toIntOrNull() 在 build script 中不存在。
// 默认值与 CI 的 tag 解析规则保持一致：v1.1.0 -> versionName 1.1.0 / versionCode 10100。
def rawVersionCode = project.findProperty("versionCode")?.toString()
def injectedVersionCode =
        (rawVersionCode != null && rawVersionCode.isInteger()) ? rawVersionCode.toInteger() : 10100
def injectedVersionName = project.findProperty("versionName")?.toString() ?: "1.1.0"

android {
    namespace 'io.reasonix.mobile'
    compileSdk 34

    // 固定调试签名：把 keystore 纳入仓库，使本地构建与 GitHub Actions 构建
    // 产出完全相同的签名，APK 之间可以相互覆盖安装（否则 CI 每次生成的新
    // debug 签名都不同，用户升级时必须先卸载、会话数据随之丢失）。
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "io.reasonix.mobile"
        minSdk 24
        targetSdk 34
        versionCode injectedVersionCode
        versionName injectedVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        // AGP 8 起默认关闭，供 Kotlin 侧读取 VERSION_NAME 等构建信息
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CameraX 核心组件
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // ML Kit 二维码扫描（Google 官方，识别快且精准）
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    // 辅助工具：Gson 用于多设备历史列表的 JSON 持久化
    implementation 'com.google.code.gson:gson:2.10.1'

    // 单元测试：PairingInfo 的解析逻辑是纯 Kotlin，可直接在 JVM 上跑，无需 Robolectric
    testImplementation 'junit:junit:4.13.2'
}
